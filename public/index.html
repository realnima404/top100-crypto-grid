<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crypto Grid</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script>if(!window.LightweightCharts)document.write('<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"><\\/script>')</script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#030507;color:#dce3ed;font:13px Arial,sans-serif}
header{position:sticky;top:0;z-index:50;background:#030507f7;border-bottom:1px solid #11161d;padding:7px 8px}
.nav{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.nav button{border:1px solid #171f29;background:#080b10;color:#aeb9c8;border-radius:6px;padding:7px 10px;cursor:pointer}.nav button.active{background:#111d2b;border-color:#365778;color:#fff}.tf{margin-left:auto;display:flex;gap:3px}.tf button{min-width:42px}.grid{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:5px;padding:5px}
.card{height:270px;background:#070a0e;border:1px solid #121821;border-radius:6px;overflow:hidden}.head{height:32px;display:flex;align-items:center;justify-content:space-between;padding:5px 7px;border-bottom:1px solid #121821}.left{display:flex;align-items:center;min-width:0}.rank{color:#526074;margin-right:4px}.symbol{font-weight:800}.exchange{color:#596678;font-size:9px;margin-left:5px}.price{color:#8794a6;font-size:11px}.fav{border:0;background:transparent;color:#566274;font-size:16px;padding:0 3px;margin-left:4px;cursor:pointer}.fav.on{color:#f4c84b}.chart{height:237px}.msg{height:100%;display:grid;place-items:center;color:#566579}
.watchSearch{display:none;position:relative;min-width:180px}.watchSearch.open{display:block}.watchSearch input{width:100%;background:#080b10;color:#dce3ed;border:1px solid #263241;border-radius:6px;padding:7px 9px}.results{position:absolute;top:40px;left:0;right:0;z-index:100;background:#070a0e;border:1px solid #202a35;border-radius:7px;box-shadow:0 15px 45px #000b;max-height:300px;overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;padding:8px;border-bottom:1px solid #121821}.row small{color:#687789}.row button{background:#0c1420;color:#c9d6e6;border:1px solid #263b52;border-radius:5px;padding:5px 9px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(200px,1fr))}}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(190px,1fr))}}
@media(max-width:700px){.watchSearch{order:10;flex:1;min-width:150px}.grid{grid-template-columns:repeat(2,minmax(165px,1fr));gap:4px;padding:4px}.card{height:235px}.chart{height:203px}.tf{margin-left:0}.nav button{padding:7px 8px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.card{height:240px}.chart{height:208px}}
</style></head>
<body>
<header><div class="nav">
<button class="view active" data-view="top">Top 100</button>
<button class="view" data-view="favorites">Favorites</button>
<button class="view" data-view="daily">Daily Watchlist</button>
<button class="view" data-view="weekly">Weekly Watchlist</button>
<button class="view" data-view="long">Long-Term Watchlist</button>
<div id="watchSearch" class="watchSearch"><input id="search" placeholder="Search coins…"><div id="results" class="results"></div></div>
<div class="tf"><button class="tfbtn" data-tf="15m">15m</button><button class="tfbtn active" data-tf="1h">1H</button><button class="tfbtn" data-tf="4h">4H</button></div>
</div></header>
<main id="grid" class="grid"></main>
<script>
const $=s=>document.querySelector(s),grid=$("#grid"),watchSearch=$("#watchSearch"),search=$("#search"),results=$("#results");
const stable=new Set(["USDT","USDC","FDUSD","TUSD","USDE","DAI","USDS","USDD","PYUSD","USD1","USDP","GUSD","FRAX","LUSD","USTC","EURC","EURT","EURS","USDB","USDY","USDM","RLUSD"]);
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let view="top",tf="1h",topCoins=[];
let lists=read("crypto-watchlists-v14",read("crypto-watchlists-v13",{daily:[],weekly:[],long:[]})),favorites=new Set(read("crypto-favorites-v14",read("crypto-favorites-v13",[])));
const records=new Map(),dataCache=new Map();
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const sym=x=>String(x||"").toUpperCase(), key=c=>c.id||sym(c.symbol), stableCoin=c=>stable.has(sym(c.symbol))||/stablecoin|tether|usd coin|dai/i.test(c.name||"");
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw Error("HTTP "+r.status);return r.json()}

async function loadTop(){
  const a=await getJSON("/api/top");
  if(!Array.isArray(a)||!a.length) throw Error("Top list unavailable");
  return a;
}
async function candles(c,t){
  const symbol=sym(c.symbol);
  const k=symbol+"|"+t;
  if(dataCache.has(k)) return dataCache.get(k);
  const interval=t==="15m"?"15":t==="4h"?"240":"60";
  const raw=await getJSON("/api/candles?symbol="+encodeURIComponent(symbol)+"&interval="+interval);
  if(!raw?.rows?.length) throw Error("No candle data");
  const rows=raw.rows.map(x=>({time:Math.floor(Number(x[0])/1000),open:Number(x[1]),high:Number(x[2]),low:Number(x[3]),close:Number(x[4]),volume:Number(x[5])}))
    .sort((a,b)=>a.time-b.time);
  dataCache.set(k,rows);
  return rows;
}
async function createRecord(c){
  const k=key(c), old=records.get(k);if(old)return old;
  const card=document.createElement("section");card.className="card";
  card.innerHTML=`<div class="head"><div class="left"><span class="rank">#${c.rank||""}</span><span class="symbol">${esc(c.symbol)}</span><button class="fav ${favorites.has(k)?"on":""}" title="Favorite">★</button><span class="exchange">${c.market?.exchange||"Market"}</span></div><span class="price">…</span></div><div class="chart"><div class="msg">Loading…</div></div>`;
  const box=card.querySelector(".chart");
  const chart=LightweightCharts.createChart(box,{width:box.clientWidth,height:box.clientHeight,layout:{background:{type:"solid",color:"#070a0e"},textColor:"#687789"},grid:{vertLines:{visible:false},horzLines:{visible:false}},rightPriceScale:{borderColor:"#111820",scaleMargins:{top:.08,bottom:.30}},timeScale:{borderColor:"#111820",timeVisible:true,rightOffset:2,barSpacing:6},crosshair:{mode:2,vertLine:{visible:false},horzLine:{visible:false}},attributionLogo:false});
  const cs=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:"#22a884",downColor:"#e65353",borderUpColor:"#22a884",borderDownColor:"#e65353",wickUpColor:"#22a884",wickDownColor:"#e65353"});
  const vs=chart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:"volume"},priceScaleId:"volume",priceLineVisible:false,lastValueVisible:false});vs.priceScale().applyOptions({scaleMargins:{top:.78,bottom:.03}});
  const rec={coin:c,card,chart,cs,vs,loaded:{}};records.set(k,rec);
  card.querySelector(".fav").onclick=()=>{favorites.has(k)?favorites.delete(k):favorites.add(k);write("crypto-favorites-v14",[...favorites]);card.querySelector(".fav").classList.toggle("on",favorites.has(k));if(view==="favorites")render()};
  new ResizeObserver(()=>chart.applyOptions({width:box.clientWidth,height:box.clientHeight})).observe(box);
  box.addEventListener("mouseleave",()=>chart.clearCrosshairPosition());
  return rec;
}
async function paint(rec,t){
  if(rec.loaded[t]){
    const rows=rec.loaded[t];
    rec.cs.setData(rows);rec.vs.setData(rows.map(x=>({time:x.time,value:x.volume,color:x.close>=x.open?"#22a88455":"#e6535355"})));
    fit(rec,rows);rec.card.querySelector(".price").textContent="$"+rows.at(-1).close.toLocaleString(undefined,{maximumFractionDigits:8});return;
  }
  try{
    const symbol=sym(rec.coin.symbol);
    const raw=await getJSON("/api/candles?symbol="+encodeURIComponent(symbol)+"&interval="+(t==="15m"?"15":t==="4h"?"240":"60"));
    if(!raw?.rows?.length) throw Error("No candle data");
    rec.coin.market={exchange:raw.exchange,pair:raw.pair};
    const rows=raw.rows.map(x=>({time:Math.floor(Number(x[0])/1000),open:Number(x[1]),high:Number(x[2]),low:Number(x[3]),close:Number(x[4]),volume:Number(x[5])})).sort((a,b)=>a.time-b.time);
    rec.loaded[t]=rows;
    rec.cs.setData(rows);rec.vs.setData(rows.map(x=>({time:x.time,value:x.volume,color:x.close>=x.open?"#22a88455":"#e6535355"})));
    fit(rec,rows);
    rec.card.querySelector(".exchange").textContent=raw.exchange;
    rec.card.querySelector(".price").textContent="$"+rows.at(-1).close.toLocaleString(undefined,{maximumFractionDigits:8});
  }catch(e){
    console.warn("Candle load failed",rec.coin.symbol,e);
    rec.card.querySelector(".chart").innerHTML='<div class="msg">Market data unavailable</div>';
  }
}
function fit(rec,rows){const n=Math.min(innerWidth<700?34:52,rows.length);rec.chart.timeScale().setVisibleLogicalRange({from:Math.max(0,rows.length-n-1),to:rows.length+1})}
async function render(){
  grid.innerHTML="";
  const raw=view==="top"
    ? topCoins
    : view==="favorites"
      ? [...new Map([...topCoins,...lists.daily,...lists.weekly,...lists.long].map(c=>[key(c),c])).values()].filter(c=>favorites.has(key(c)))
      : (lists[view]||[]);

  if(!raw.length){
    grid.innerHTML='<div class="msg" style="padding:30px">No coins in this list yet.</div>';
    updateTools(); return;
  }

  // Render cards immediately. Do NOT wait for market metadata.
  for(const c of raw){
    const rec=await createRecord({...c,market:null});
    rec.coin={...c,market:null};
    rec.card.dataset.key=key(c);
    grid.appendChild(rec.card);
    paint(rec,tf);
  }
  updateTools();
}
function updateTools(){
  const open=view==="daily"||view==="weekly"||view==="long";
  watchSearch.classList.toggle("open",open);
  if(!open){search.value="";results.innerHTML="";}
}
document.querySelectorAll(".view").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll(".tfbtn").forEach(b=>b.onclick=()=>{if(tf===b.dataset.tf)return;tf=b.dataset.tf;document.querySelectorAll(".tfbtn").forEach(x=>x.classList.toggle("active",x===b));for(const rec of records.values())if(grid.contains(rec.card))paint(rec,tf)});
document.addEventListener("click",e=>{if(!watchSearch.contains(e.target)&&!e.target.closest(".view")){results.innerHTML="";}});
let timer;search.addEventListener("input",()=>{clearTimeout(timer);const q=search.value.trim();timer=setTimeout(()=>searchCoins(q),250)});
async function searchCoins(q){
  if(q.length<2){results.innerHTML="";return}
  try{
    const j=await getJSON("/api/search?q="+encodeURIComponent(q));
    const rows=(j.coins||[]).filter(x=>!stableCoin({symbol:x.symbol,name:x.name})).slice(0,12);
    results.innerHTML=rows.map((x,i)=>`<div class="row"><span><b>${esc(sym(x.symbol))}</b> <small>${esc(x.name)}</small></span><button data-i="${i}">Add</button></div>`).join("")||'<div class="row"><small>No coins found.</small></div>';
    results.querySelectorAll("[data-i]").forEach(btn=>btn.onclick=async()=>{const x=rows[+btn.dataset.i],c=await resolve({id:x.id,name:x.name,symbol:x.symbol.toUpperCase(),rank:null});if(!c){btn.textContent="No USDT market";return}if(!lists[view].some(y=>key(y)===key(c))){lists[view].push(c);write("crypto-watchlists-v14",lists)}search.value="";results.innerHTML="";await render()});
  }catch(e){results.innerHTML='<div class="row"><small>Search unavailable.</small></div>'}
}
(async()=>{try{topCoins=await loadTop();await render()}catch(e){console.error(e);grid.innerHTML='<div class="msg" style="padding:30px">Unable to load market data. Please refresh the page.</div>'}})();
</script></body></html>
