<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Scanner V9</title>
<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;animation:none!important;transition:none!important}
body{margin:0;background:#030507;color:#dbe2ec;font:14px Inter,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#030507f5;border-bottom:1px solid #11161d;padding:8px}
.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.title{font-weight:850;margin-right:6px}
button,input,select{background:#0a0e13;color:#dbe2ec;border:1px solid #1c2530;border-radius:7px;padding:7px 9px}button{cursor:pointer}button:hover{background:#111821}
button.active{background:#122238;border-color:#426d9e}.tf{min-width:42px}.status{margin-left:auto;color:#68778a;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:5px;padding:5px}
.card{height:270px;background:#070a0e;border:1px solid #121821;border-radius:6px;overflow:hidden}.head{height:32px;padding:5px 7px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #121821;font-size:11px}.head-left{display:flex;align-items:center;min-width:0}.rank{color:#586577;margin-right:5px}.symbol{font-weight:800}.exchange{color:#596678;font-size:9px;margin-left:5px}.price{color:#8794a6}.chart{height:237px}.msg{height:100%;display:grid;place-items:center;color:#536175}
.fav,.add{background:transparent;border:0;padding:0 3px;margin-left:4px;font-size:16px}.fav{color:#4d5a6b}.fav.active{color:#f4c84b}.add{color:#536173}
.tv-lightweight-charts a,.tv-lightweight-charts [class*=attribution],.tv-lightweight-charts [class*=logo],a[href*=tradingview]{display:none!important;visibility:hidden!important}
.drawer{position:fixed;left:10px;top:56px;z-index:30;width:280px;max-height:calc(100vh - 70px);overflow:auto;background:#070a0e;border:1px solid #202a35;border-radius:9px;box-shadow:0 12px 40px #000b;padding:10px;display:none}.drawer.open{display:block}
.drawer h3{margin:4px 0 10px}.list{padding:9px;border:1px solid #121821;border-radius:7px;margin:5px 0;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.list.selected{background:#102033;border-color:#34577e}.list small{color:#68778a}.list .del{padding:3px 6px}.search{display:flex;gap:5px;margin:8px 0}.search input{width:100%}.result,.member{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #111820}.result small,.member small{color:#6b7889}.empty{color:#586678;padding:12px 3px;font-size:12px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(210px,1fr))}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(200px,1fr))}}
@media(max-width:700px){header{padding:6px}.title{width:100%}.status{width:100%;margin-left:0}.grid{grid-template-columns:repeat(2,minmax(170px,1fr));gap:4px;padding:4px}.card{height:235px}.chart{height:203px}.drawer{left:5px;top:52px;width:calc(100vw - 10px)}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.card{height:240px}.chart{height:208px}}
</style></head><body>
<header><div class="controls">
<b class="title">CRYPTO SCANNER</b>
<button class="tab active" data-view="top">Top 100</button>
<button class="tab" data-view="favorites">★ Favorites</button>
<button id="watch">📋 Watchlists</button>
<div id="tf"><button class="tf" data-tf="15m">15m</button><button class="tf active" data-tf="1h">1H</button><button class="tf" data-tf="4h">4H</button></div>
<button id="refresh">Refresh</button><span id="status" class="status">Loading…</span>
</div></header>

<aside id="drawer" class="drawer">
<h3>📋 My Watchlists</h3>
<div class="search"><input id="newName" placeholder="New watchlist name"><button id="create">＋</button></div>
<div id="lists"></div>
<hr style="border-color:#121821;border-width:1px 0 0;margin:12px 0">
<div class="search"><input id="coinSearch" placeholder="Search any coin…"></div>
<div id="results"></div>
</aside>
<main id="grid" class="grid"></main>

<script>
const $=s=>document.querySelector(s), grid=$("#grid"), status=$("#status");
const favKey="v9fav", listKey="v9lists", selectedKey="v9selected";
let view="top", tf="1h", top=[], cache=new Map(), cards=new Map(), loading=new Set();
const stable=new Set(["USDT","USDC","FDUSD","TUSD","USDE","DAI","USDS","USDD","PYUSD","USD1","USDP","GUSD","FRAX","LUSD","USTC","EURC","EURT","EURS","USDB","USDY","USDM","USDX","RLUSD"]);
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const favs=()=>new Set(read(favKey,[])); const lists=()=>read(listKey,{});
const key=c=>c.id?`cg:${c.id}`:`s:${c.symbol}`;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function setStatus(s){status.textContent=s}
function isStable(s,n){return stable.has(String(s).toUpperCase())||/stablecoin|tether|usd coin|dai/i.test(n||"")}
async function topCoins(){
 const r=await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false");if(!r.ok)throw Error("CoinGecko unavailable");
 return (await r.json()).filter(x=>!isStable(x.symbol,x.name)).map(x=>({id:x.id,name:x.name,symbol:x.symbol.toUpperCase(),rank:x.market_cap_rank}));
}
let maps={};
async function exmap(ex){
 if(maps[ex])return maps[ex];
 const u=ex==="Binance"?"https://api.binance.com/api/v3/exchangeInfo":"https://api.bybit.com/v5/market/instruments-info?category=spot&limit=1000";
 const r=await fetch(u);if(!r.ok)throw Error("Exchange unavailable");const j=await r.json(),m=new Map();
 if(ex==="Binance")for(const x of j.symbols||[])if(x.status==="TRADING"&&x.quoteAsset==="USDT")m.set(x.baseAsset.toUpperCase(),x.symbol);
 else for(const x of j.result?.list||[])if(x.status==="Trading"&&x.quoteCoin==="USDT")m.set(x.baseCoin.toUpperCase(),x.symbol);
 return maps[ex]=m;
}
async function resolve(c){if(c.exchange)return c;const [b,y]=await Promise.all([exmap("Binance"),exmap("Bybit")]);if(b.has(c.symbol))return {...c,exchange:"Binance",pair:b.get(c.symbol)};if(y.has(c.symbol))return {...c,exchange:"Bybit",pair:y.get(c.symbol)};return null}
async function candles(c){
 const ck=`${c.exchange}|${c.pair}|${tf}`;if(cache.has(ck))return cache.get(ck);
 const cfg=tf==="15m"?["15m","15"]:tf==="4h"?["4h","240"]:["1h","60"];
 const u=c.exchange==="Binance"?`https://api.binance.com/api/v3/klines?symbol=${c.pair}&interval=${cfg[0]}&limit=200`:`https://api.bybit.com/v5/market/kline?category=spot&symbol=${c.pair}&interval=${cfg[1]}&limit=200`;
 const r=await fetch(u);if(!r.ok)throw Error("Data unavailable");const j=await r.json();let a=c.exchange==="Binance"?j:j.result?.list||[];
 const rows=a.map(x=>({time:Math.floor(+x[0]/1000),open:+x[1],high:+x[2],low:+x[3],close:+x[4],volume:+x[5]})).sort((a,b)=>a.time-b.time);cache.set(ck,rows);return rows;
}
async function draw(card){
 if(loading.has(card)||card.dataset.loaded)return;loading.add(card);
 try{const c=await resolve(card._coin);if(!c){card.remove();return}card._coin=c;card.querySelector(".exchange").textContent=c.exchange;
 const box=card.querySelector(".chart");box.innerHTML="";
 const chart=LightweightCharts.createChart(box,{width:box.clientWidth,height:box.clientHeight,layout:{background:{type:"solid",color:"#070a0e"},textColor:"#667386"},grid:{vertLines:{visible:false},horzLines:{visible:false}},rightPriceScale:{borderColor:"#121821",scaleMargins:{top:.08,bottom:.30}},timeScale:{borderColor:"#121821",timeVisible:true,rightOffset:2,barSpacing:6},crosshair:{mode:2,vertLine:{visible:false},horzLine:{visible:false}},attributionLogo:false});
 const cs=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:"#26a69a",downColor:"#ef5350",borderUpColor:"#26a69a",borderDownColor:"#ef5350",wickUpColor:"#26a69a",wickDownColor:"#ef5350"});
 const vs=chart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:"volume"},priceScaleId:"volume",priceLineVisible:false,lastValueVisible:false});vs.priceScale().applyOptions({scaleMargins:{top:.78,bottom:.03}});
 const rows=await candles(c);cs.setData(rows);vs.setData(rows.map(x=>({time:x.time,value:x.volume,color:x.close>=x.open?"#26a69a55":"#ef535055"})));
 const n=Math.min(innerWidth<700?34:50,rows.length);chart.timeScale().setVisibleLogicalRange({from:Math.max(0,rows.length-n-1),to:rows.length+1});
 card.querySelector(".price").textContent="$"+rows.at(-1).close.toLocaleString(undefined,{maximumFractionDigits:8});
 new ResizeObserver(()=>chart.applyOptions({width:box.clientWidth,height:box.clientHeight})).observe(box);box.addEventListener("mouseleave",()=>chart.clearCrosshairPosition());
 card.dataset.loaded="1";
 }catch(e){card.querySelector(".chart").innerHTML=`<div class="msg">${esc(e.message)}</div>`}finally{loading.delete(card)}
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){draw(e.target);io.unobserve(e.target)}}),{rootMargin:"600px"});
function make(c){
 const k=`${key(c)}|${tf}`;let card=cards.get(k);if(card)return card;
 card=document.createElement("section");card.className="card";card._coin=c;
 const f=favs();card.innerHTML=`<div class="head"><div class="head-left"><span class="rank">${c.rank?`#${c.rank}`:""}</span><span class="symbol">${esc(c.symbol)}</span><button class="fav ${f.has(key(c))?"active":""}">★</button><button class="add">＋</button><span class="exchange">${c.exchange||""}</span></div><span class="price">…</span></div><div class="chart"><div class="msg">Loading…</div></div>`;
 card.querySelector(".fav").onclick=()=>{let s=favs(),k=key(c);s.has(k)?s.delete(k):s.add(k);write(favKey,[...s]);card.querySelector(".fav").classList.toggle("active",s.has(k));if(view==="favorites")render()};
 card.querySelector(".add").onclick=()=>addCurrent(c);cards.set(k,card);return card;
}
function current(){const ls=lists(),sel=localStorage.getItem(selectedKey);if(view==="top")return top;if(view==="favorites"){const f=favs(),extra=Object.values(ls).flat();const m=new Map([...top,...extra].map(x=>[key(x),x]));return [...m.values()].filter(x=>f.has(key(x)))}return ls[localStorage.getItem(selectedKey)]||[]}
function render(){grid.innerHTML="";const cs=current();if(!cs.length){grid.innerHTML='<div class="empty" style="padding:20px">Nothing here yet.</div>';return}for(const c of cs){const card=make(c);grid.appendChild(card);io.observe(card)}setStatus(`${cs.length} charts • ${tf}`)}
function renderLists(){
 const ls=lists(),sel=localStorage.getItem(selectedKey);$("#lists").innerHTML=Object.keys(ls).length?Object.keys(ls).map(n=>`<div class="list ${n===sel?"selected":""}" data-list="${esc(n)}"><span>📁 ${esc(n)} <small>(${ls[n].length})</small></span><button class="del" data-del="${esc(n)}">×</button></div>`).join(""):'<div class="empty">No watchlists yet. Create one above.</div>';
 document.querySelectorAll("[data-list]").forEach(x=>x.onclick=e=>{if(e.target.closest("[data-del]"))return;localStorage.setItem(selectedKey,x.dataset.list);view="watch";document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));$("#watch").classList.add("active");renderLists();render()});
 document.querySelectorAll("[data-del]").forEach(x=>x.onclick=e=>{e.stopPropagation();const ls=lists();delete ls[x.dataset.del];write(listKey,ls);if(localStorage.getItem(selectedKey)===x.dataset.del)localStorage.removeItem(selectedKey);renderLists();if(view==="watch")render()});
}
function addCurrent(c){const n=localStorage.getItem(selectedKey);if(!n)return alert("Create/select a watchlist first.");const ls=lists();ls[n]=ls[n]||[];if(!ls[n].some(x=>key(x)===key(c)))ls[n].push(c);write(listKey,ls);renderLists()}
$("#watch").onclick=()=>{$("#drawer").classList.toggle("open");renderLists()};
$("#create").onclick=()=>{const n=$("#newName").value.trim();if(!n)return;const ls=lists();if(ls[n])return alert("This watchlist already exists.");ls[n]=[];write(listKey,ls);localStorage.setItem(selectedKey,n);$("#newName").value="";renderLists();view="watch";render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll(".tf").forEach(b=>b.onclick=()=>{if(tf===b.dataset.tf)return;tf=b.dataset.tf;document.querySelectorAll(".tf").forEach(x=>x.classList.toggle("active",x===b));cards.clear();cache.clear();render()});
$("#refresh").onclick=()=>{cache.clear();cards.clear();render()};
let timer;$("#coinSearch").oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();if(q.length<2){$("#results").innerHTML="";return}timer=setTimeout(async()=>{try{const r=await fetch("https://api.coingecko.com/api/v3/search?query="+encodeURIComponent(q));const j=await r.json();const a=(j.coins||[]).slice(0,15);$("#results").innerHTML=a.map((x,i)=>`<div class="result"><span><b>${esc(x.symbol.toUpperCase())}</b> <small>${esc(x.name)}</small></span><button data-r="${i}">＋</button></div>`).join("");document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{const x=a[+b.dataset.r],c=await resolve({id:x.id,name:x.name,symbol:x.symbol.toUpperCase()});if(c)addCurrent(c);else alert("No Binance/Bybit USDT market.")})}catch{$("#results").innerHTML='<div class="empty">Search unavailable</div>'}},250)};
(async()=>{try{top=await topCoins();top=(await Promise.all(top.map(resolve))).filter(Boolean);render()}catch(e){setStatus("Error: "+e.message)}})();
</script></body></html>
